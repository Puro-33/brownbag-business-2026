<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="map-title map-desc"><title id="map-title">경영학 이후의 네 갈래 진로</title><desc id="map-desc">경영학을 베이스로 전문직, 금융, 일반기업, 창업과 대학원으로 진로를 설계할 수 있습니다.</desc><style>text{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}a{cursor:pointer}a:hover rect{stroke:#b84b2b;stroke-width:2}.map-title{font-size:24px;fill:#272822;font-weight:650}.map-sub{font-size:13px;fill:#68695f}.path{fill:none;stroke:#bcb9ac;stroke-width:1.5}</style><rect width="980" height="410" fill="#f6f4eb" rx="16"/><text x="32" y="40" font-size="12" fill="#8a4b33">CAREER MAP · Q12</text><rect x="335" y="63" width="310" height="84" rx="12" fill="#273b33"/><text x="490" y="98" font-size="24" fill="#fff" text-anchor="middle" font-weight="650">경영학은 베이스</text><text x="490" y="124" font-size="13" fill="#d8e2dc" text-anchor="middle">내 역량과 경험을 조합해 만드는 진로</text><path class="path" d="M490 147V179 M135 179H855 M135 179V210 M375 179V210 M615 179V210 M855 179V210"/><rect x="20" y="210" width="220" height="134" rx="12" fill="#fffdf7" stroke="#dedbd0"/><text x="38" y="247" class="map-title">전문직</text><text x="38" y="272" class="map-sub">깊이 있는 전문성</text><text x="38" y="304" font-size="12" fill="#3f443c">회계사 · 세무사 · 노무사</text><text x="38" y="324" font-size="12" fill="#3f443c">로스쿨 · 감정평가사 등</text><rect x="260" y="210" width="220" height="134" rx="12" fill="#fffdf7" stroke="#dedbd0"/><text x="278" y="247" class="map-title">금융</text><text x="278" y="272" class="map-sub">숫자로 읽는 산업</text><text x="278" y="304" font-size="12" fill="#3f443c">금융공기업 · 은행 · 증권</text><text x="278" y="324" font-size="12" fill="#3f443c">운용 · 신평 · 데이터 금융</text><rect x="500" y="210" width="220" height="134" rx="12" fill="#fffdf7" stroke="#dedbd0"/><text x="518" y="247" class="map-title">일반기업</text><text x="518" y="272" class="map-sub">직무로 설계하는 커리어</text><text x="518" y="304" font-size="12" fill="#3f443c">기획 · PM · 재무 · 마케팅</text><text x="518" y="324" font-size="12" fill="#3f443c">대기업 · 중견 · 중소기업</text><rect x="740" y="210" width="220" height="134" rx="12" fill="#fffdf7" stroke="#dedbd0"/><text x="758" y="247" class="map-title">제3의 길</text><text x="758" y="272" class="map-sub">직접 만드는 다음 단계</text><text x="758" y="304" font-size="12" fill="#3f443c">창업 · 대학원 · MBA</text><text x="758" y="324" font-size="12" fill="#3f443c">관심 분야의 심화·확장</text><text x="32" y="382" font-size="12" fill="#68695f">정해진 정답이 아닌 선택지 지도 · 첨부 자료 Q12를 바탕으로 구성</text></svg>